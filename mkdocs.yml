site_name: Enterprise AI Decision Systems
site_description: Open, reproducible research companion to the IEEE EADS papers.
site_author: EADS Research Companion Project
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - admonition
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - Research Design: research_design.md
  - Architecture: architecture.md
  - Module Mapping: module_mapping.md
  - Evaluation: evaluation.md
  - Tutorials: tutorials/README.md
  - Examples: examples/README.md
  - Benchmarks:
      - Published results: benchmarks/index.md
      - About: benchmarks/about.md
  - Diagrams: diagrams/README.md
  - Technical Report: technical_report.md
  - Demo: wow_demo.md
  - Promotion: promotion.md
  - FAQ: FAQ.md
  - Limitations: limitations.md
  - Security: security.md
  - Threat Model: threat_model.md
  - Future Research: future_research.md
  - Roadmap: roadmap.md
