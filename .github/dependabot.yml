version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ["pytest*", "ruff", "mypy", "coverage"]
  # Actions are the supply chain for CI; Dependabot is what keeps their pinned versions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
