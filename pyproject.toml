[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-ai-decision-systems"
version = "1.0.0"
description = "A reproducible, modular research companion for reliable Enterprise AI Decision Systems."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [{name = "Nirmal Kumar Jingar"}]
keywords = [
    "enterprise ai",
    "large language models",
    "multi-agent systems",
    "decision systems",
    "supply chain intelligence",
    "legacy modernization",
    "governance",
    "reproducible research",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# The core package is standard library only: every optional integration lives in an extra.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "ruff>=0.4,<1", "mypy>=1.10,<3", "coverage>=7.0,<8"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "pymdown-extensions>=10.0,<11"]
openai = ["openai>=1.0,<3"]
anthropic = ["anthropic>=0.30,<1"]
ollama = ["ollama>=0.2,<1"]
transformers = ["transformers>=4.40,<6", "torch>=2.0,<3"]
solvers = [
    "scipy>=1.12,<2",
    "pulp>=2.8,<4",
    "ortools>=9.9,<10",
    "scikit-learn>=1.4,<2",
]
forecasters = ["sktime>=0.30,<2", "pandas>=2.0,<3", "numpy>=1.26,<3"]
pdf = ["pymupdf>=1.24,<2"]
# `all` deliberately excludes torch: it is a multi-gigabyte download that no test or example
# needs. Install the `transformers` extra explicitly to get it.
all = [
    "enterprise-ai-decision-systems[anthropic,docs,forecasters,ollama,openai,pdf,solvers]",
]

[project.urls]
Homepage = "https://github.com/nirmaljingar/enterprise-ai-decision-systems"
Repository = "https://github.com/nirmaljingar/enterprise-ai-decision-systems"
Documentation = "https://nirmaljingar.github.io/enterprise-ai-decision-systems"
"Bug Tracker" = "https://github.com/nirmaljingar/enterprise-ai-decision-systems/issues"

[tool.hatch.build.targets.wheel]
packages = ["eads"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["eads"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
